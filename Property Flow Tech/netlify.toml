[build]
  command = "npm run build"
  publish = "dist"

# Local dev via Netlify CLI (optional but nice to have)
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

# SPA routing – lets React Router handle all paths instead of Netlify 404-ing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
